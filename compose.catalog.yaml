# Opt-in override: docker compose -f compose.yaml -f compose.catalog.yaml up -d
services:
  recipebot:
    environment:
      RECIPE_CATALOG_PATH: /data/recipes.sqlite
    volumes:
      - type: bind
        source: ${RECIPE_CATALOG_FILE:?Set RECIPE_CATALOG_FILE to an absolute immutable SQLite file}
        target: /data/recipes.sqlite
        read_only: true
        bind:
          create_host_path: false
